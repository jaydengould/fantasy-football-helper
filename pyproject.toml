[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ffhelper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "yfpy>=17.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["ffhelper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
