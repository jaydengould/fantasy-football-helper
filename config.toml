[tunables]
tier_break_sigma = 1.0
# Within-position rank gap that earns a flag. See Tunables in config.py.
divergence_flag_slots = 10

[tunables.flex_share]
RB = 0.5
WR = 0.5
TE = 0.0

# How often each board asks the platform for new picks. This is the ONLY knob
# controlling how far behind the draft you are, and both the terminal and the web
# board read it. Floored at 1s in code: a 0 busy-loops, and Sleeper IP-blocks
# above ~1000 req/min. Measured 2026-08-27: 1s is 60 req/min, 0 failures over 30
# consecutive polls, median latency 158 ms. Raise it if a draft ever gets rate
# limited -- one line.
[tunables.poll_seconds]
sleeper = 1
yahoo = 12

[[league]]
name = "sleeper-main"
platform = "sleeper"
league_id = "1395959490938966016"
# Which ADP the survival model believes. "ffc" or "sleeper".
#
# Set to "sleeper" on a MECHANISM, not on the (circular) mock result: Sleeper
# displays its own ADP on the draft board to all twelve drafters during the
# draft. They anchor on the number in front of them. Most have never seen FFC's.
#
# The stdev sweep in scripts/calibrate.py rules out the easy alternative --
# multiplying FFC's stdev by 1.5/2/3/4/6 pulls the bottom bucket from 74% down
# to 4% but leaves the middle buckets stuck at ~87% at every k. That is a wrong
# MEAN, and no amount of widening fixes a location error.
#
# Known cost: Sleeper's `adp_ppr` folds in TE-premium leagues, so TEs read ~20
# picks earlier than a flat-scoring league would take them (QB +0.4 and RB -1.4
# are identical; WR is -9.7). Partly self-fulfilling, since that same skewed
# number is what the room is looking at -- but treat TE survival with suspicion.
#
# ONE LINE TO REVERT. Confirm with a human mock:
#   .venv/bin/python scripts/calibrate.py <draft_id> 5
adp_source = "sleeper"
# Set by hand 2026-08-25 on the user's word, never read from the API -- the tool
# deliberately does not guess this, because a wrong slot silently produces the
# wrong next-pick number for every pick of the draft. Cross-checked against the
# live draft_order, which independently maps this user to slot 5 and still has
# slot 8 unassigned. RE-CHECKED 2026-08-31 after the draft moved to Sept 1 -- a
# rescheduled draft is exactly when a league might re-roll the order. It did not:
# still slot 5, still 11 of 12 with slot 8 open.
draft_slot = 5

# Task 13 rehearsal. Borrows sleeper-main's synced scoring and roster and points
# the pick feed at a Sleeper mock draft instead -- a mock has a draft_id but no
# league of its own, so its settings cannot be fetched. Set draft_id from the
# mock draft URL (the long number after /draft/), set draft_slot to the seat you
# drew, then: python -m ffhelper.cli run --league mock
# Confirmed a `league_mock` of league 1395959490938966016: same 12 teams, PPR,
# 15 rounds, same roster slots -- so sleeper-main's synced scoring is correct
# for it. draft_order confirms seat 5. Delete this block after Task 13.
# adp_source MUST match sleeper-main, or the rehearsal is not a rehearsal: it is
# the one setting that changes every SURV number on screen, and the point of the
# mock is to see the board you will see on Sept 1.
[[league]]
name = "mock"
platform = "sleeper"
league_id = "1395959490938966016"
draft_id = "1398747013708894208"
draft_slot = 5
adp_source = "sleeper"

# HUMAN MOCK (TODO.md §12/§16 rehearsal). Sleeper has no public mock lobby with
# real people, so the human mock runs on Yahoo -- which also rehearses the Sept 1
# interface, since Yahoo has no feed and every pick is hand-typed.
#
# THREE LINES TO SET FROM THE LOBBY BEFORE YOU START:
#   num_teams   -- whatever the mock says (Yahoo lobbies are usually 12)
#   draft_slot  -- the seat you drew; it is random and only known at draft time
