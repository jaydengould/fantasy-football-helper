# Yahoo's Fantasy API needs per-developer approval that will not arrive before
# the Sept 1 draft, so league_id is unused today -- there is no feed and no
# settings sync. Everything below is hand-entered, which is the FIRST-CLASS
# path for this platform, not a fallback. Picks are entered by hand.
league_id = "723573"
draft_slot = 2
# Changed from "ffc" 2026-08-26 on a MEASUREMENT, replacing a mechanism-only
# argument ("those drafters are not in the Sleeper app") that was never tested.
#
# Three 12-team half-PPR Yahoo mocks, 540 picks, three different seats, pooled
# by scripts/calibrate.py. Both leagues resolve to the same ADP format
# (half-ppr), so only team count differs between that test and this league.
#
#   model says   FFC   Sleeper   ideal
#     0-20%      68%     46%      10%
#    20-40%      82%     60%      30%
#    40-60%      83%     72%      50%
#    60-80%      87%     83%      70%
#   80-100%      92%     93%      90%
#
# FFC spans 24 points across its whole range and is not monotonic -- close to no
# discriminating power. Sleeper spans 47 and rises in every bucket. The rooms
# were NOT list-followers (median ADP rank taken 7/9/10 vs a bot mock's 2), so
# this is not circular.
#
# KNOWN AND UNFIXED: both sources are far too pessimistic in LEVEL -- the model
# says 0-20% and roughly half survive. Read the SURV column as an ordering, not
# as a probability. Not corrected in code: value.py is frozen before the drafts,
# and a shift fitted to three mock rooms may not transfer to ten humans.
#
# ONE LINE TO REVERT to "ffc". See TODO.md section 12a.
adp_source = "sleeper"

[league.settings]
num_teams = 10
bench = 5

[league.settings.roster_slots]
QB = 1
RB = 2
WR = 2
TE = 1
FLEX = 2
K = 1
DEF = 1

